name: Rebuild Astro Frontend

# trigger manually, on push, or via webhook (e.g. from Strapi content update)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [strapi-content-updated]
  push:
    branches: [main]
    paths:
      - 'astro/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        working-directory: astro
        run: npm ci

      - name: Build Astro (static generation)
        working-directory: astro
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
        run: npm run build

      # Coolify deployment via webhook
      - name: Trigger Coolify rebuild
        run: |
          curl -s -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" || true
