version: '3.9'

services:
  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    container_name: portfolio_strapi
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: ./.tmp/data.db
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-to-a-secure-secret}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-change-me-to-a-secure-salt}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-secure-jwt-secret}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-change-me-to-a-secure-transfer-salt}
      APP_KEYS: ${APP_KEYS:-change-me-to-secure-app-keys-comma-separated}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-to-a-secure-encryption-key}
    volumes:
      - ./strapi/.tmp:/app/.tmp
      - ./strapi/public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1337/admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portfolio-network

  frontend:
    build:
      context: ./astro
      dockerfile: Dockerfile
    container_name: portfolio_app
    ports:
      - "3000:80"
    environment:
      NODE_ENV: production
      STRAPI_URL: http://strapi:1337
      STRAPI_TOKEN: ${STRAPI_TOKEN}
    depends_on:
      strapi:
        condition: service_healthy
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
